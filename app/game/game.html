<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/style.css" />
    <title>Vamos jogar!</title>
  </head>
  <body>
    <header class="header_Game">
      <div>
        <div class="home_img">
          <img src="../assets/img/Holly l.png" alt="Imagem do inicio" />
          <img src="../assets/img/Star.png" alt="Imagem de estrela" />
          <h1>Jogo da Memória</h1>
          <img src="../assets/img/holly.png" alt="Logo do jogo da memória" />
          <img src="../assets/img/Star.png" alt="Imagem de estrela" />
        </div>
      </div>

      <div class="jogaror-vez">
        <img src="../assets/img/text_transform.png" alt="" />
        <p id="indicador-vez">Vez do Jogador 1</p>
        <div class="circulo"></div>
      </div>

      <div class="placar">
        <div class="player-card ativo" id="card-j1">
          <div class="info">
            <div class="avatar">
              <img src="../assets/img/player1.png" alt="Avatar Jogador 1" />
            </div>
            <div class="informacoes">
              <small>JOGANDO AGORA</small>
              <strong>Jogador 1</strong>
            </div>
          </div>
          <div class="pontos">
            <p id="pontos-j1">0</p>
            <span>PONTOS</span>
          </div>
        </div>

        <div class="player-card" id="card-j2">
          <div class="info">
            <div class="avatar">
              <img src="../assets/img/player2.png" alt="Avatar Jogador 2" />
            </div>
            <div class="informacoes">
              <small>AGUARDANDO A VEZ</small>
              <strong>Jogador 2</strong>
            </div>
          </div>
          <div class="pontos">
            <p id="pontos-j2">0</p>
            <span>PONTOS</span>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="grid" id="tabuleiro"></div>

      <div class="mensagem_ganhador" id="modal-fim">
        <div class="header_parabens">
          <h1 class="parabens">Parabéns</h1>
        </div>

        <div class="conteudo_principal">
          <p class="mensagem">
            Parabéns! Você ganhou está partida. Que tal jogar novamente e testar
            suas habilidades?
          </p>
          <div class="botoes">
            <button class="jogarNovamente">Jogar Novamente</button>
            <a href="../index.html">Trocar jogadores</a>
          </div>
        </div>
      </div>
    </div>

  
<section class="tabuleiro">
  <!-- Linha 1 -->
  <div class="carta encontrada"><div class="icone"><img src="../assets/img/carta_virada_para_baixo.png" alt="Carta virada para baixo"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ snowman.png" alt="Boneco de neve"></div></div>
  <div class="carta encontrada"><div class="icone"><img src="../assets/img/carta_ bell.png" alt="Sino"></div></div>
  <div class="carta selecionada"><div class="icone"><img src="../assets/img/carta_ gift.png" alt="Presente"></div></div>

  <!-- Linha 2 -->
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ snowman.png" alt="Boneco de neve"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ santa.png" alt="Papai Noel"></div></div>
  <div class="carta encontrada"><div class="icone"><img src="../assets/img/carta_ tree.png" alt="Árvore de Natal"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ gingerbread.png" alt="Biscoito de Natal"></div></div>

  <!-- Linha 3 -->
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ santa.png" alt="Papai Noel"></div></div>
  <div class="carta selecionada"><div class="icone"><img src="../assets/img/carta_ stocking.png" alt="Meia"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ gift.png" alt="Presente"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ gingerbread.png" alt="Biscoito de Natal"></div></div>

  <!-- Linha 4 -->
  <div class="carta encontrada"><div class="icone"><img src="../assets/img/carta_ bell.png" alt="Sino"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ candle.png" alt="Vela"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ stocking.png" alt="Meia"></div></div>
  <div class="carta"><div class="icone"><img src="../assets/img/carta_ candle.png" alt="Vela"></div></div>
</section>

    <script src="../assets/script.js"></script>
  </body>
</html>
