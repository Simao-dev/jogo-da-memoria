<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/style.css" />
    <title>Vamos jogar!</title>
  </head>
  <body>
    <header class="header_Game">
      <div>
        <div class="home_img">
          <img src="../assets/img/Holly l.png" alt="Imagem do inicio" />
          <img src="../assets/img/Star.png" alt="Imagem de estrela" />
          <h1>Jogo da Memória</h1>
          <img src="../assets/img/holly.png" alt="Logo do jogo da memória" />
          <img src="../assets/img/Star.png" alt="Imagem de estrela" />
        </div>
      </div>

      <div class="jogaror-vez">
        <img src="../assets/img/text_transform.png" alt="" />
        <p id="indicador-vez">Vez do Jogador 1</p>
        <div class="circulo"></div>
      </div>

      <div class="placar">
        <div class="player-card ativo" id="card-j1">
          <div class="info">
            <div class="avatar">
              <img src="../assets/img/player1.png" alt="Avatar Jogador 1" />
            </div>
            <div class="informacoes">
              <small>JOGANDO AGORA</small>
              <strong>Jogador 1</strong>
            </div>
          </div>
          <div class="pontos">
            <p id="pontos-j1">0</p>
            <span>PONTOS</span>
          </div>
        </div>

        <div class="player-card" id="card-j2">
          <div class="info">
            <div class="avatar">
              <img src="../assets/img/player2.png" alt="Avatar Jogador 2" />
            </div>
            <div class="informacoes">
              <small>AGUARDANDO A VEZ</small>
              <strong>Jogador 2</strong>
            </div>
          </div>
          <div class="pontos">
            <p id="pontos-j2">0</p>
            <span>PONTOS</span>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="grid" id="tabuleiro"></div>

      <div class="mensagem_ganhador" id="modal-fim">
        <div class="header_parabens">
          <h1 class="parabens" id="mensagem-vencedor">Parabéns!</h1>
        </div>

        <div class="conteudo_principal">
          <p class="mensagem">
            Que tal jogar novamente e testar suas habilidades?
          </p>
          <div class="botoes">
            <button class="jogarNovamente" onclick="iniciarJogo()">Jogar Novamente</button>
            <a href="../index.html">Trocar jogadores</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/script.js"></script>
  </body>
</html>
